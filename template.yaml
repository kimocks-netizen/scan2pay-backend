AWSTemplateFormatVersion: 2010-09-09
Description: Scan2Pay API — FastAPI on Lambda + Supabase + Paystack
Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [x86_64]
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        SUPABASE_URL: !Sub '{{resolve:ssm:/scan2pay/${Environment}/SUPABASE_URL}}'
        SUPABASE_SERVICE_ROLE_KEY: !Sub '{{resolve:ssm:/scan2pay/${Environment}/SUPABASE_SERVICE_ROLE_KEY}}'
        JWT_SECRET: !Sub '{{resolve:ssm:/scan2pay/${Environment}/JWT_SECRET}}'
        WINSMS_API_KEY: !Sub '{{resolve:ssm:/scan2pay/${Environment}/WINSMS_API_KEY}}'
        WINSMS_API_URL: https://api.winsms.co.za/api/rest/v1
        MASTER_OTP: !Sub '{{resolve:ssm:/scan2pay/${Environment}/MASTER_OTP}}'
        GOOGLE_CLIENT_ID: !Sub '{{resolve:ssm:/scan2pay/${Environment}/GOOGLE_CLIENT_ID}}'
        GOOGLE_CLIENT_SECRET: !Sub '{{resolve:ssm:/scan2pay/${Environment}/GOOGLE_CLIENT_SECRET}}'
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,Idempotency-Key'"
      AllowOrigin: "'*'"
      MaxAge: "'600'"

Resources:

  # ── Main API Lambda ─────────────────────────────────────────────────────────
  Scan2PayApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.main.handler
      CodeUri: .
      Description: Scan2Pay FastAPI application
      MemorySize: 512
      Timeout: 30
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub 'scan2pay/${Environment}/*'
        - S3CrudPolicy:
            BucketName: !Ref AssetsBucket
        - DynamoDBReadPolicy:
            TableName: !Ref WebSocketConnectionsTable
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Scan2PayWebSocketApi}/*'
      Environment:
        Variables:
          PAYSTACK_SECRET_KEY: !Sub '{{resolve:ssm:/scan2pay/${Environment}/PAYSTACK_SECRET_KEY}}'
          PAYSTACK_PUBLIC_KEY: !Sub '{{resolve:ssm:/scan2pay/${Environment}/PAYSTACK_PUBLIC_KEY}}'
          PAYSTACK_WEBHOOK_SECRET: !Sub '{{resolve:ssm:/scan2pay/${Environment}/PAYSTACK_WEBHOOK_SECRET}}'
          ASSETS_BUCKET: !Ref AssetsBucket
          WS_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
          WEBSOCKET_ENDPOINT: !Sub 'https://${Scan2PayWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
      Events:
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY

  # ── Cron: expire single-use charges every minute ────────────────────────────
  ExpireChargesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.cron.expire_charges.handler
      CodeUri: .
      Description: Set active=false on payment codes past expires_at
      Timeout: 60
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(* * * * ? *)
            Description: Expire charges every minute

  # ── Cron: reconcile pending Paystack payments every 15 min ─────────────────
  ReconcilePaystackFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.cron.reconcile_paystack.handler
      CodeUri: .
      Description: Verify pending payments older than 10 min against Paystack
      Timeout: 120
      Environment:
        Variables:
          PAYSTACK_SECRET_KEY: !Sub '{{resolve:ssm:/scan2pay/${Environment}/PAYSTACK_SECRET_KEY}}'
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(*/15 * * * ? *)
            Description: Reconcile Paystack every 15 minutes

  # ── Cron: build settlement batches daily at 20:00 SAST (18:00 UTC) ──────────
  BuildSettlementsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.cron.build_settlements.handler
      CodeUri: .
      Description: Group settled transactions into payout rows
      Timeout: 300
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 18 * * ? *)
            Description: Build settlements daily at 18:00 UTC (20:00 SAST)

  # ── Cron: purge (anonymise) archived accounts after 90 days ────────────────
  PurgeArchivedAccountsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.cron.purge_archived_accounts.handler
      CodeUri: .
      Description: POPIA — anonymise personal fields + delete KYC docs on accounts archived 90+ days with no reactivation
      Timeout: 60
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref AssetsBucket
      Environment:
        Variables:
          ASSETS_BUCKET: !Ref AssetsBucket
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 3 * * ? *)
            Description: Run daily at 03:30 UTC (05:30 SAST)

  # ── WebSocket API Gateway ────────────────────────────────────────────────────
  Scan2PayWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'Scan2PayWebSocketAPI-${Environment}'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Scan2PayWebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WebSocketConnectIntegration}'

  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Scan2PayWebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WebSocketDisconnectIntegration}'

  WebSocketConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Scan2PayWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketConnectFunction.Arn}/invocations'

  WebSocketDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Scan2PayWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDisconnectFunction.Arn}/invocations'

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Scan2PayWebSocketApi
      StageName: Prod
      AutoDeploy: true

  WebSocketConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebSocketConnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Scan2PayWebSocketApi}/*/*'

  WebSocketDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebSocketDisconnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Scan2PayWebSocketApi}/*/*'

  # ── WebSocket Connections Table (DynamoDB) ───────────────────────────────────
  WebSocketConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'scan2pay-ws-connections-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: txn_id
          AttributeType: S
        - AttributeName: merchant_id
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: txn_id-index
          KeySchema:
            - AttributeName: txn_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: merchant_id-index
          KeySchema:
            - AttributeName: merchant_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── $connect Lambda ──────────────────────────────────────────────────────────
  WebSocketConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.ws.connect.handler
      CodeUri: .
      Description: WebSocket $connect — validate token, store connection
      MemorySize: 128
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnectionsTable
      Environment:
        Variables:
          WS_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable

  # ── $disconnect Lambda ───────────────────────────────────────────────────────
  WebSocketDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.ws.disconnect.handler
      CodeUri: .
      Description: WebSocket $disconnect — remove connection from DynamoDB
      MemorySize: 128
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnectionsTable
      Environment:
        Variables:
          WS_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable

  # ── S3 bucket for merchant logos, QR images, KYC docs, CMS assets ──────────
  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'scan2pay-assets-${Environment}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins:
              - 'https://scan2pay.site'
              - 'https://vula-pay.site'
              - 'https://vula-pay.co.za'
              - 'https://vula-pay.xyz'
              - 'http://localhost:3000'
            AllowedHeaders: ['*', 'content-type', 'x-amz-*']
            ExposedHeaders: [ETag]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveKycDocs
            Status: Enabled
            Prefix: kyc/
            Transitions:
              - TransitionInDays: 90
                StorageClass: GLACIER_IR
              - TransitionInDays: 365
                StorageClass: GLACIER
            ExpirationInDays: 730
          - Id: ArchiveCmsAssets
            Status: Enabled
            Prefix: cms/
            Transitions:
              - TransitionInDays: 90
                StorageClass: GLACIER_IR

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod"
  AssetsBucketName:
    Description: S3 bucket for assets
    Value: !Ref AssetsBucket
  WebSocketEndpoint:
    Description: WebSocket API endpoint
    Value: !Sub "wss://${Scan2PayWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
